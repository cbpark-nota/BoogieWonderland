# 셀프호스팅 풀스택: db + backend + frontend + collector
# 사용법: cd deploy/docker && cp ../.env.example .env && docker compose up -d

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-momentum}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DATABASE_URL_SYNC: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_SCHEDULER_ENABLED: "true"
      APP_CORS_ORIGINS: '["http://localhost","http://localhost:${FRONTEND_PORT:-80}"]'
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        API_URL: ""
        DEPLOY_MODE: fullstack
        BASE_HREF: /
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

  collector:
    build:
      context: ../../scripts/collector
      dockerfile: Dockerfile
    env_file: .env
    environment:
      COLLECT_DATA_DIR: /data/daily
      TZ: Asia/Seoul
    volumes:
      - collectdata:/data/daily
    restart: unless-stopped

volumes:
  pgdata:
  collectdata:
