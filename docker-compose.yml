services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: momentum
      POSTGRES_PASSWORD: momentum
      POSTGRES_DB: momentum
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momentum"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://momentum:momentum@db:5432/momentum
      APP_DATABASE_URL_SYNC: postgresql://momentum:momentum@db:5432/momentum
      APP_SCHEDULER_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
