name: Flutter Web → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BASE_HREF: /BoogieWonderland/

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 스크리닝 데이터 생성 (서버리스 모드)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python 의존성 설치
        run: pip install yfinance pandas pandas-ta numpy lxml beautifulsoup4 requests pykrx openpyxl

      - name: 이전 history 파일 복원 (gh-pages에서)
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f1)
          REPO=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f2)
          PAGES_BASE="https://${OWNER}.github.io/${REPO}"
          HISTORY_DIR="frontend/web/data/history"
          mkdir -p "$HISTORY_DIR"
          if curl -sf "${PAGES_BASE}/data/history/index.json" -o /tmp/history_index.json; then
            echo "이전 history index 발견, 파일 복원 중..."
            DATES=$(python3 -c "import json; d=json.load(open('/tmp/history_index.json')); print('\n'.join(d.get('dates', [])))")
            while IFS= read -r date; do
              if [ -n "$date" ]; then
                curl -sf "${PAGES_BASE}/data/history/${date}.json" -o "${HISTORY_DIR}/${date}.json" \
                  && echo "  복원: ${date}.json" || echo "  건너뜀: ${date}.json"
              fi
            done <<< "$DATES"
          else
            echo "이전 history 없음 — 오늘부터 시작"
          fi

      - name: 스크리닝 JSON 생성
        run: python scripts/export_json.py --output frontend/web/data/
        continue-on-error: true  # 스크리닝 실패 시에도 포트폴리오 재조회는 반드시 실행

      - name: 포트폴리오 현재가 재조회
        run: python scripts/export_json.py --portfolio-only --output frontend/web/data/

      # Flutter 웹 빌드 (서버리스 모드)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: 'stable'

      - name: Flutter 의존성 설치
        working-directory: frontend
        run: flutter pub get

      - name: Flutter 웹 빌드 (서버리스)
        working-directory: frontend
        run: |
          flutter build web --release \
            --base-href "${{ env.BASE_HREF }}" \
            --dart-define=DEPLOY_MODE=serverless

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v5

      - name: 빌드 결과물 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
