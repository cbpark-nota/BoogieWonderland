name: Flutter Web → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/_screening-deploy.yml
    with:
      base_href: '/BoogieWonderland/'
    permissions:
      contents: read
      pages: write
      id-token: write
