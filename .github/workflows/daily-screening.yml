name: 일일 스크리닝 + 서버리스 배포

on:
  schedule:
    - cron: '0 19 * * 1-5'  # UTC 19:00 = KST 04:00, 월~금 (한국 시장 종가 후)
    - cron: '0 23 * * 1-5'  # UTC 23:00 = KST 08:00, 월~금 (미국 시장 종가 후)
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/_screening-deploy.yml
    with:
      base_href: '/BoogieWonderland/'
    permissions:
      contents: read
      pages: write
      id-token: write
