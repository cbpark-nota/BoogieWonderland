name: 일일 스크리닝 + 서버리스 배포

on:
  schedule:
    - cron: '0 14 * * 1-5'  # UTC 14:00 = KST 23:00, 월~금
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  screening-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Python 스크리닝 실행
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python 의존성 설치
        run: pip install yfinance pandas pandas-ta numpy

      - name: 스크리닝 실행 및 JSON 생성
        run: python scripts/export_json.py --output frontend/web/data/

      # Flutter 웹 빌드 (서버리스 모드)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: 'stable'

      - name: Flutter 의존성 설치
        working-directory: frontend
        run: flutter pub get

      - name: Flutter 웹 빌드 (서버리스)
        working-directory: frontend
        run: |
          flutter build web --release \
            --base-href "/BoogieWonderland/" \
            --dart-define=DEPLOY_MODE=serverless

      # GitHub Pages 배포
      - name: GitHub Pages 설정
        uses: actions/configure-pages@v5

      - name: 빌드 결과물 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
