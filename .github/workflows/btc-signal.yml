name: BTC 신호 업데이트 (4시간마다)

on:
  schedule:
    - cron: '0 0,4,8,12,16,20 * * *'  # UTC 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 (매일, 주말 포함)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  btc-signal-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ── Python 설정 ───────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Python 의존성 설치
        run: pip install -r scripts/requirements.txt

      # ── 현재 Pages 데이터 복원 ────────────────────────────────
      # 스크리닝 JSON + 히스토리를 Pages에서 내려받아 Flutter 빌드에 포함시킨다.
      - name: Pages 데이터 복원
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f1)
          REPO=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f2)
          PAGES_BASE="https://${OWNER}.github.io/${REPO}"
          DATA_DIR="frontend/web/data"
          HISTORY_DIR="${DATA_DIR}/history"
          mkdir -p "$HISTORY_DIR"

          # 스크리닝 + 부가 데이터 JSON 복원
          for f in screening_latest.json screening_strategies.json screening_kr_strategies.json \
                   market_cap.json portfolio.json sell_signals.json \
                   vix_etf_prices.json short_squeeze_latest.json; do
            curl -sf "${PAGES_BASE}/data/${f}" -o "${DATA_DIR}/${f}" \
              && echo "  복원: ${f}" || echo "  없음: ${f} (건너뜀)"
          done

          # 히스토리 복원 (일별 스크리닝 결과 보존)
          if curl -sf "${PAGES_BASE}/data/history/index.json" -o /tmp/history_index.json; then
            cp /tmp/history_index.json "${HISTORY_DIR}/index.json"
            echo "히스토리 복원 시작..."
            DATES=$(python3 -c "
          import json
          d = json.load(open('/tmp/history_index.json'))
          print('\n'.join(d.get('dates', [])))
          ")
            while IFS= read -r date; do
              if [ -n "$date" ]; then
                curl -sf "${PAGES_BASE}/data/history/${date}.json" \
                  -o "${HISTORY_DIR}/${date}.json" \
                  && echo "  복원: ${date}.json" || echo "  건너뜀: ${date}.json"
              fi
            done <<< "$DATES"
          else
            echo "이전 히스토리 없음 — 건너뜀"
          fi

      # ── BTC 신호 계산 및 JSON 업데이트 ───────────────────────
      - name: BTC 신호 계산
        run: python scripts/crypto/update_btc_signal.py --output frontend/web/data/
        continue-on-error: true  # API 실패 시에도 기존 Pages 데이터로 재배포

      # ── Flutter 웹 빌드 ───────────────────────────────────────
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: 'stable'
          cache: true

      - name: Flutter 의존성 설치
        working-directory: frontend
        run: flutter pub get

      - name: Flutter 웹 빌드 (서버리스)
        working-directory: frontend
        run: |
          flutter build web --release \
            --base-href "/BoogieWonderland/" \
            --dart-define=DEPLOY_ENV=serverless

      # ── GitHub Pages 배포 ─────────────────────────────────────
      - name: GitHub Pages 설정
        uses: actions/configure-pages@v5

      - name: 빌드 결과물 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
